<!DOCTYPE html>
<html lang="en">
  
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZenMint - Word Guess</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="header"></div>
  <main>
    <a href="https://mehrzadazizi.github.io/ZenLand/">← Back to Home</a>
    <section class="send-token-form">
     
  <div class="game-container">

      <h2> 🧠 Word Guessing Game</h2>

    <h3>✅ Correct</h3>
    <div class="row" id="correctRow">
    </div>

    <h3>❌ Error</h3>
    <div class="row" id="wrongRow">
    </div>

    <p>Error Number: <span id="errorCount">0</span>/8</p>

   <div class="input-section">
      <input type="text" class="wordInput" id="wordInput" placeholder="Enter Your Word">
      <div>
      <button id="startBtn">Guessing</button>
      </div>
    
      </div>
    </section>
   
  </main>

  <script type="module">
    import { ethers } from 'https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.esm.min.js';
    import { loadComponent } from './components.js';

    await loadComponent('header', './header.html');

    // Wallet connection logic
    const connectBtn = document.getElementById('connectBtn');
    const gmBtn = document.getElementById('gmBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');

    let walletAddress = localStorage.getItem('walletAddress');
    if (walletAddress) {
      connectBtn.textContent = `${walletAddress.slice(0, 6)}...${walletAddress.slice(-4)}`;
      gmBtn.disabled = false;
      disconnectBtn.style.display = 'inline-block';
    } else {
      connectBtn.textContent = '🦊 Connect Wallet';
      gmBtn.disabled = true;
      disconnectBtn.style.display = 'none';
    }
    
    async function connectWallet() {
      try {
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        walletAddress = accounts[0];
        localStorage.setItem('walletAddress', walletAddress);

        connectBtn.textContent = `${walletAddress.slice(0, 6)}...${walletAddress.slice(-4)}`;
        gmBtn.disabled = false;
        disconnectBtn.style.display = 'inline-block';

        await window.ethereum.request({
          method: 'wallet_addEthereumChain',
          params: [{
            chainId: '0x20d8',
            chainName: 'ZenChain Testnet',
            nativeCurrency: {
              name: 'ZenChain Token',
              symbol: 'ZTC',
              decimals: 18
            },
            rpcUrls: ['https://zenchain-testnet.api.onfinality.io/public']
          }]
        });
      } catch (err) {
        console.error('Wallet connection failed:', err);
        alert('❌ Failed to connect wallet.');
      }
    }
    // Game logic will be loaded from external JS
    import('./main.js');
  </script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <script src="/script.js"></script>
</body>

</html>
